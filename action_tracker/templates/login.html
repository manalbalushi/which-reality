{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h4 class="section-title">Sign in</h4>
      <p class="text-muted small">Prototype access control: pick your user to see role-based screens
        (Owner / Reviewer / Admin / Management). Production build uses Microsoft Entra ID SSO.</p>
      <form method="post">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="mb-3">
          <label class="form-label">User</label>
          <select class="form-select" name="user_id" required>
            <option value="" disabled selected>Choose a user…</option>
            {% for u in users %}
            <option value="{{ u.id }}">{{ u.name }} — {{ u.role }} ({{ u.department }})</option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
